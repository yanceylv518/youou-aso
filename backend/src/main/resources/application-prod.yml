spring:
  datasource:
    url: ${YOUOU_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/youou_aso?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${YOUOU_DATASOURCE_USERNAME:youou_aso}
    password: ${YOUOU_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${YOUOU_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${YOUOU_DATASOURCE_MIN_IDLE:2}
      connection-timeout: ${YOUOU_DATASOURCE_CONNECTION_TIMEOUT:30000}
  data:
    redis:
      host: ${YOUOU_REDIS_HOST:127.0.0.1}
      port: ${YOUOU_REDIS_PORT:6379}
      password: ${YOUOU_REDIS_PASSWORD:}
      database: ${YOUOU_REDIS_DATABASE:0}
      timeout: ${YOUOU_REDIS_TIMEOUT:3000ms}
  mail:
    host: ${YOUOU_MAIL_HOST:}
    port: ${YOUOU_MAIL_PORT:587}
    username: ${YOUOU_MAIL_USERNAME:}
    password: ${YOUOU_MAIL_APP_PASSWORD:${YOUOU_MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${YOUOU_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${YOUOU_MAIL_STARTTLS_ENABLE:true}
          ssl:
            enable: ${YOUOU_MAIL_SSL_ENABLE:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    basedir: ${YOUOU_TOMCAT_BASEDIR:/tmp/youou-aso}

youou:
  security:
    jwt-secret: ${YOUOU_JWT_SECRET:}
    jwt-secret-file: ${YOUOU_JWT_SECRET_FILE:/opt/youou-aso/secrets/jwt-secret}
    jwt-ttl-seconds: ${YOUOU_JWT_TTL_SECONDS:86400}
  mail:
    from: ${YOUOU_MAIL_FROM:${YOUOU_MAIL_USERNAME:}}

logging:
  file:
    name: ${YOUOU_LOG_FILE:/opt/youou-aso/logs/application.log}
  level:
    root: ${YOUOU_LOG_LEVEL_ROOT:INFO}
    com.youou.aso: ${YOUOU_LOG_LEVEL_APP:INFO}
    org.springframework.security: ${YOUOU_LOG_LEVEL_SECURITY:WARN}
